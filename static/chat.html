<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lockout Flow — AI Chat Prototype</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Lockout Flow <span class="proto-tag">AI prototype</span></h1>
      <p class="subtitle"><a href="/">← Back to the guided walkthrough</a></p>
      <button id="resetBtn" class="reset-btn" type="button">Reset demo</button>
    </header>

    <main id="log" class="log"></main>

    <form id="composer" class="composer" style="display:none">
      <input id="messageInput" type="text" autocomplete="off"
             placeholder="Message the host, as the support agent..." />
      <button type="submit">Send</button>
    </form>
    <div id="wrapupBar" class="wrapup-bar" style="display:none">
      <button id="wrapupBtn" class="wrapup-btn" type="button">Wrap up &amp; log incident →</button>
    </div>
  </div>

  <script src="/static/persona.js"></script>
</body>
</html>
