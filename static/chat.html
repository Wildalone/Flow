<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lockout Flow — AI Chat Prototype</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Lockout Flow <span class="proto-tag">AI prototype</span></h1>
      <p class="subtitle">Free-form chat, driven live by a Groq/Llama tool-calling agent. <a href="/">← Back to the guided walkthrough</a></p>
      <button id="resetBtn" class="reset-btn" type="button">Reset demo</button>
    </header>

    <main id="log" class="log"></main>

    <form id="composer" class="composer">
      <input id="messageInput" type="text" autocomplete="off"
             placeholder="e.g. Guest at 42 Oak St says they're locked out" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
